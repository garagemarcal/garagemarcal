<!DOCTYPE html>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,sans-serif;
}

body{
min-height:100vh;
background:
  radial-gradient(ellipse 80% 45% at 50% 0%,rgba(200,16,30,.16) 0%,transparent 70%),
  radial-gradient(circle at 50% 30%,#0d0d10 0%,#000 65%);
color:white;
display:flex;
justify-content:center;
overflow-x:hidden;
position:relative;
}

#particles{

inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.container{
width:92%;
max-width:380px;
text-align:center;
padding:56px 0 35px;
z-index:1;
}

.logo{
margin-bottom:30px;
line-height:.82;
text-transform:uppercase;
user-select:none;
}

.logo span{
display:block;
font-family:Saira,sans-serif;
font-style:italic;
font-weight:900;
font-size:68px;
letter-spacing:-.01em;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

.logo .garage{
background-image:linear-gradient(180deg,#fff 0%,#fff 45%,#b9bcc4 100%);
filter:drop-shadow(0 2px 14px rgba(255,255,255,.18));
}

.logo .marcal{
background-image:linear-gradient(180deg,#ff3b30 0%,#e10600 50%,#9e0400 100%);
filter:drop-shadow(0 0 22px rgba(225,6,0,.5));
}

.info p{
margin:6px;
font-size:14px;
}

.buttons{
display:flex;
flex-direction:column;
gap:14px;
margin-top:22px;
}

.btn{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:1px;
position:relative;
min-height:56px;
text-decoration:none;
color:#000;
background:#fff;
border:2px solid #fff;
padding:9px 12px 9px 48px;
border-radius:18px;
transition:.3s;
}

.btn:hover{
transform:scale(1.03);
box-shadow:0 0 24px rgba(255,255,255,.35);
}

.btn-logo{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
width:24px;
height:24px;
object-fit:contain;
}

.btn-logo.round{
clip-path:circle(42%);
}

.btn-title{
font-size:16px;
font-weight:800;
line-height:1.2;
}

.btn-sub{
font-size:10.5px;
font-weight:600;
line-height:1.3;
white-space:nowrap;
color:rgba(0,0,0,.65);
}

.footer{
margin-top:22px;
color:rgba(255,255,255,.45);
font-size:12px;
}

@media (max-width:360px){
.logo span{font-size:56px;}
.btn-sub{white-space:normal;}
}
</style>
</head>

<body>

<canvas id="particles" aria-hidden="true"></canvas>

<div class="container">

<h1 class="logo" aria-label="Garage Marçal">
<span class="garage">Garage</span>
<span class="marcal">Marcal</span>
</h1>

<div class="info">
<p><b>▸ Audi A3 Sportback ◂</b></p>
<p>🚀 Projetos e modificações para seu Audi.</p>
</div>

<div class="buttons">

<a class="btn" href="https://fansbuy.com/register?invite=RmFucy1RMEJ4a2cxNQ==" target="_blank" rel="noopener">
<img class="btn-logo" src="assets/fansbuy.webp" alt="Fansbuy">

<span class="btn-sub">Crie sua conta Fansbuy e ganhe cupons de desconto.</span>
</a>

<a class="btn" href="https://instagram.com/garagemarcal" target="_blank" rel="noopener">
<img class="btn-logo" src="assets/instagram.webp" alt="Instagram">
<span class="btn-title">CONFIRA NOSSO INSTAGRAM</span>
</a>

<a class="btn" href="https://www.youtube.com/@richardmarcall" target="_blank" rel="noopener">
<img class="btn-logo" src="assets/youtube.png" alt="YouTube">
<span class="btn-title">CANAL NO YOUTUBE</span>
</a>

<a class="btn" href="https://www.tiktok.com/@garagemarcal" target="_blank" rel="noopener">
<img class="btn-logo round" src="assets/tiktok.avif" alt="TikTok">
<span class="btn-title">SIGA-NOS NO TIKTOK</span>
</a>

</div>

<div class="footer">
© 2026 GARAGE MARCAL
</div>

</div>

<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr, particles = [], sprites = {}, last = 0, running = true;

  // Pre-rendered soft glow sprites (much cheaper than shadowBlur per frame)
  function makeSprite(r, g, b) {
    const size = 64;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const grad = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.25, `rgba(${r},${g},${b},.8)`);
    grad.addColorStop(0.6, `rgba(${r},${g},${b},.15)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = grad;
    x.fillRect(0, 0, size, size);
    return c;
  }

  sprites.white = makeSprite(255, 255, 255);
  sprites.red = makeSprite(255, 40, 30);

  // depth: 0 = far (small, slow, dim) ... 1 = near (big, fast, bright)
  function createParticle(randomY) {
    const depth = Math.pow(Math.random(), 1.8);
    return {
      x: Math.random() * w,
      y: randomY ? Math.random() * h : -20,
      depth,
      size: 2 + depth * 9,
      speed: 12 + depth * 55,
      sway: 6 + depth * 18,
      swaySpeed: 0.3 + Math.random() * 0.6,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.15 + depth * 0.6,
      twinkle: 0.5 + Math.random() * 1.5,
      sprite: Math.random() < 0.12 ? sprites.red : sprites.white
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const target = Math.round(Math.min(140, Math.max(45, (w * h) / 9000)));
    while (particles.length < target) particles.push(createParticle(true));
    particles.length = target;
  }

  // --- Lightning ---
  let bolts = [], nextBolt = 3 + Math.random() * 4;

  // Midpoint displacement: jagged line between two points
  function jag(x1, y1, x2, y2, spread, out) {
    if (spread < 4) { out.push([x2, y2]); return; }
    const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * spread;
    const my = (y1 + y2) / 2 + (Math.random() - 0.5) * spread * 0.3;
    jag(x1, y1, mx, my, spread / 2, out);
    jag(mx, my, x2, y2, spread / 2, out);
  }

  function createBolt() {
    const x0 = w * (0.1 + Math.random() * 0.8);
    const y1 = h * (0.35 + Math.random() * 0.4);
    const x1 = x0 + (Math.random() - 0.5) * w * 0.3;
    const main = [[x0, -10]];
    jag(x0, -10, x1, y1, Math.min(w, h) * 0.25, main);

    const paths = [{ pts: main, width: 1 }];
    const branches = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < branches; i++) {
      const start = main[Math.floor(main.length * (0.2 + Math.random() * 0.5))];
      const len = h * (0.08 + Math.random() * 0.15);
      const dir = Math.random() < 0.5 ? -1 : 1;
      const pts = [start];
      jag(start[0], start[1], start[0] + dir * len * 0.7, start[1] + len, len * 0.5, pts);
      paths.push({ pts, width: 0.5 });
    }
    // flicker pattern: brightness per ~60ms step
    const flicker = [1, 0.25, 0.9, 0.5, 0.75, 0.35, 0.2, 0.1];
    return { paths, age: 0, life: flicker.length * 0.06, flicker };
  }

  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function drawBolts() {
    let flash = 0;
    ctx.lineCap = ctx.lineJoin = 'round';
    for (const b of bolts) {
      const a = b.flicker[Math.min(b.flicker.length - 1, Math.floor(b.age / 0.06))];
      flash = Math.max(flash, a);
      for (const p of b.paths) {
        ctx.shadowColor = 'rgba(255,40,30,1)';
        ctx.shadowBlur = 25;
        ctx.strokeStyle = `rgba(255,60,50,${0.35 * a})`;
        ctx.lineWidth = 7 * p.width;
        strokePath(p.pts);
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,255,255,1)';
        ctx.strokeStyle = `rgba(255,235,235,${0.95 * a})`;
        ctx.lineWidth = 1.8 * p.width;
        strokePath(p.pts);
      }
    }
    ctx.shadowBlur = 0;
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,220,220,${0.06 * flash})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    drawBolts();
    for (const p of particles) {
      const x = p.x + Math.sin(t * p.swaySpeed + p.phase) * p.sway;
      const a = p.alpha * (0.75 + 0.25 * Math.sin(t * p.twinkle + p.phase));
      // fade in at top / out at bottom
      const edge = Math.min(1, (p.y + 20) / 80, (h - p.y) / 120);
      ctx.globalAlpha = Math.max(0, a * edge);
      const s = p.size * 2;
      ctx.drawImage(p.sprite, x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    if (!running) return;
    const t = now / 1000;
    const dt = Math.min(0.05, last ? t - last : 0);
    last = t;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.y += p.speed * dt;
      if (p.y > h + 20) particles[i] = createParticle(false);
    }
    nextBolt -= dt;
    if (nextBolt <= 0) {
      bolts.push(createBolt());
      // occasionally a quick second strike
      nextBolt = Math.random() < 0.25 ? 0.25 : 5 + Math.random() * 3;
    }
    for (const b of bolts) b.age += dt;
    bolts = bolts.filter(b => b.age < b.life);
    draw(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running && !reduceMotion) { last = 0; requestAnimationFrame(frame); }
  });

  resize();
  if (reduceMotion) draw(0);
  else requestAnimationFrame(frame);
})();
</script>

</body>
</html>
